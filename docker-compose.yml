services:
  # In-Memory Buffer & Queue
  redis:
    image: redis:7-alpine
    container_name: reverse_logistics_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Authentication Gateway (bcrypt + JWT). The single source of identity.
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: reverse_logistics_auth
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - USERS_FILE=/data/users.json
    volumes:
      - auth_data:/data
    ports:
      - "5000:5000"
    restart: unless-stopped

  # Core FastAPI Gateway + XGBoost + TreeSHAP + Cost Engine
  # Verifies the JWT issued by `server`.
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reverse_logistics_api
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONUNBUFFERED=1
      - AUTH_GATEWAY_URL=http://server:5000
    depends_on:
      - redis
      - server
    ports:
      - "8000:8000"
    restart: unless-stopped

  # Warehouse Supervisor UI (Nginx) — proxies /api to the auth gateway.
  frontend:
    image: nginx:alpine
    container_name: reverse_logistics_dashboard
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server
      - backend
    restart: unless-stopped

volumes:
  auth_data:
